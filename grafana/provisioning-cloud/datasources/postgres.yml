apiVersion: 1

# Cloud-specific variant of grafana/provisioning/datasources/postgres.yml
# (the local docker-compose one, untouched). Per ADR-0018 (amends
# ADR-0016): Neon (serverless Postgres) replaces Cloud SQL -- this file
# previously used the Cloud SQL Unix-socket path
# (`/cloudsql/PROJECT:REGION:INSTANCE`); Neon is reached over a standard
# host:port TCP connection instead, same as any regular managed Postgres,
# with TLS required.
#
# EXPLICITLY UNVERIFIED, same as the Cloud SQL version before it, per
# deployment-design.md's own "Open items for implementation" list: this
# is the stated/expected mechanism, not yet confirmed against a real
# Cloud Run + Neon instance -- confirm this actually connects on the
# first real deploy before trusting it, and fix here (not by reverting to
# a workaround) if it doesn't.
#
# Uses Grafana's own provisioning env-var expansion (`${VAR}` syntax,
# resolved from the container's real environment at Grafana startup) for
# host, user, password, and database, rather than baking any of them into
# this file -- same pattern as the Cloud SQL version's
# CLOUDSQL_CONNECTION_NAME/POSTGRES_PASSWORD, renamed here to
# NEON_HOST/NEON_USER/NEON_PASSWORD/NEON_DATABASE.
# All four are set on the Grafana Cloud Run service at deploy time
# (deploy/gcp-deploy.sh) -- NEON_HOST/NEON_USER/NEON_DATABASE as plain env
# vars (an endpoint hostname, username, and database name aren't secret on
# their own), NEON_PASSWORD via --set-secrets. None of the four are
# committed here.
datasources:
  - name: Interactions Postgres
    type: postgres
    uid: postgres-interactions
    access: proxy
    url: ${NEON_HOST}:5432
    database: ${NEON_DATABASE}
    user: ${NEON_USER}
    secureJsonData:
      password: ${NEON_PASSWORD}
    jsonData:
      # Already-fixed setting from the earlier Grafana version-drift bug
      # (Grafana 13.1.1's Postgres plugin reads the database name from
      # jsonData, not the legacy top-level `database:` field above) --
      # unchanged by this migration, per ADR-0018's own instruction.
      database: ${NEON_DATABASE}
      sslmode: require
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
